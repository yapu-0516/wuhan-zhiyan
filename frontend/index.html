<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a17" />
    <meta name="description" content="城市智眼 CityEye —— 武汉城市智能监测与辅助治理平台（三维数字孪生城市运行指挥中心）" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23071430'/%3E%3Cpath d='M5 24C12 13 36 13 43 24C36 35 12 35 5 24Z' fill='none' stroke='%2336e4ff' stroke-width='3'/%3E%3Ccircle cx='24' cy='24' r='8' fill='%2336e4ff'/%3E%3Ccircle cx='24' cy='24' r='3.2' fill='%23071430'/%3E%3Ccircle cx='26.3' cy='21.7' r='1.4' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>城市智眼 CityEye · 城市运行指挥中心</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050a17;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(ellipse at 50% 42%, rgba(31, 120, 209, 0.28), transparent 60%),
          linear-gradient(180deg, #050a17, #03060f);
        color: #d6e4ff;
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif;
        transition:
          opacity 0.6s ease,
          visibility 0.6s ease;
      }
      #splash.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      #splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(79, 195, 247, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(79, 195, 247, 0.06) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      }
      .splash-eye {
        position: relative;
        width: 132px;
        height: 132px;
      }
      .splash-eye svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 18px rgba(54, 228, 255, 0.6));
      }
      .splash-ring {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 1px solid rgba(79, 195, 247, 0.25);
        border-top-color: #36e4ff;
        animation: splash-spin 1.4s linear infinite;
      }
      .splash-ring.r2 {
        inset: -22px;
        border-top-color: transparent;
        border-right-color: rgba(54, 228, 255, 0.6);
        animation-duration: 2.6s;
        animation-direction: reverse;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .splash-title {
        position: relative;
        margin: 6px 0 0;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 12px;
        text-indent: 12px;
        background: linear-gradient(180deg, #fff 20%, #9fe9ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .splash-sub {
        position: relative;
        margin: -12px 0 0;
        font-size: 12px;
        letter-spacing: 4px;
        color: #8aa3c4;
      }
      .splash-bar {
        position: relative;
        width: 220px;
        height: 2px;
        overflow: hidden;
        border-radius: 1px;
        background: rgba(79, 195, 247, 0.15);
      }
      .splash-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #36e4ff, transparent);
        animation: splash-bar 1.2s ease-in-out infinite;
      }
      @keyframes splash-bar {
        to {
          left: 100%;
        }
      }
      #splash-status {
        position: relative;
        font-size: 12px;
        letter-spacing: 2px;
        color: #6f87a8;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-eye">
        <span class="splash-ring"></span>
        <span class="splash-ring r2"></span>
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <radialGradient id="sp-iris" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#e8fdff" />
              <stop offset="0.45" stop-color="#36e4ff" />
              <stop offset="1" stop-color="#0d4f91" />
            </radialGradient>
          </defs>
          <path d="M4 24 C 12 12, 36 12, 44 24 C 36 36, 12 36, 4 24 Z" fill="none" stroke="#4fc3f7" stroke-width="1.6" />
          <circle cx="24" cy="24" r="8" fill="url(#sp-iris)" />
          <circle cx="24" cy="24" r="3" fill="#03101f" />
          <circle cx="26.2" cy="21.8" r="1.3" fill="#fff" />
        </svg>
      </div>
      <h1 class="splash-title">城市智眼</h1>
      <p class="splash-sub">CITYEYE · 城市运行指挥中心</p>
      <div class="splash-bar"></div>
      <div id="splash-status">正在启动…</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
