<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101215" />
    <meta name="description" content="城市智眼 CityEye —— 武汉城市智能监测与辅助治理平台（三维数字孪生城市运行指挥中心）" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23071430'/%3E%3Cpath d='M5 24C12 13 36 13 43 24C36 35 12 35 5 24Z' fill='none' stroke='%2336e4ff' stroke-width='3'/%3E%3Ccircle cx='24' cy='24' r='8' fill='%2336e4ff'/%3E%3Ccircle cx='24' cy='24' r='3.2' fill='%23071430'/%3E%3Ccircle cx='26.3' cy='21.7' r='1.4' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>城市智眼 CityEye · 城市运行指挥中心</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101215;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #101215;
        color: #d8dde1;
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif;
        transition:
          opacity 0.6s ease,
          visibility 0.6s ease;
      }
      #splash.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      .splash-eye {
        position: relative;
        width: 88px;
        height: 88px;
      }
      .splash-eye svg {
        width: 100%;
        height: 100%;
      }
      .splash-ring {
        position: absolute;
        inset: -7px;
        border-radius: 50%;
        border: 1px solid rgba(79, 195, 247, 0.25);
        border-top-color: #6dc7e7;
        animation: splash-spin 1.4s linear infinite;
      }
      .splash-ring.r2 {
        inset: -15px;
        border-top-color: transparent;
        border-right-color: #6dc7e7;
        animation-duration: 2.6s;
        animation-direction: reverse;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .splash-title {
        position: relative;
        margin: 6px 0 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0;
        color: #f5f7f8;
      }
      .splash-sub {
        position: relative;
        margin: -8px 0 0;
        font-size: 12px;
        letter-spacing: 0;
        color: #a2a9af;
      }
      .splash-bar {
        position: relative;
        width: 220px;
        height: 2px;
        overflow: hidden;
        border-radius: 1px;
        background: rgba(79, 195, 247, 0.15);
      }
      .splash-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: #6dc7e7;
        animation: splash-bar 1.2s ease-in-out infinite;
      }
      @keyframes splash-bar {
        to {
          left: 100%;
        }
      }
      #splash-status {
        position: relative;
        font-size: 12px;
        letter-spacing: 0;
        color: #858e95;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-eye">
        <span class="splash-ring"></span>
        <span class="splash-ring r2"></span>
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M4 24 C 12 12, 36 12, 44 24 C 36 36, 12 36, 4 24 Z" fill="none" stroke="#8edbf2" stroke-width="1.6" />
          <circle cx="24" cy="24" r="8" fill="#6dc7e7" />
          <circle cx="24" cy="24" r="3" fill="#03101f" />
          <circle cx="26.2" cy="21.8" r="1.3" fill="#fff" />
        </svg>
      </div>
      <div class="splash-title">城市智眼</div>
      <p class="splash-sub">武汉城市运行指挥中心</p>
      <div class="splash-bar"></div>
      <div id="splash-status">正在启动…</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
